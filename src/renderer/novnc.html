<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:* ws://localhost:*" />
    <title>KVM Console</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #screen { width: 100vw; height: 100vh; }
      #hint { position: fixed; left: 0; right: 0; top: 0; padding: 6px 10px; font: 12px system-ui; color: #9fb3cc; background: rgba(10,16,27,.85); }
      #hint.hidden { display: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #1b1e20; color: #bdc3c7; font: 13px "Noto Sans", sans-serif; z-index: 10; }
      #loading.hidden { display: none; }
      #loading .spinner { width: 26px; height: 26px; border: 2px solid #3b4045; border-top-color: #3daee9; border-radius: 50%; animation: spin 1s linear infinite; }
      #loading-text { max-width: 80%; text-align: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <div id="loading"><div class="spinner"></div><div id="loading-text" data-zh="正在连接 iDRAC 控制台…" data-en="Connecting to iDRAC console…">正在连接 iDRAC 控制台…</div></div>
    <div id="hint" data-zh="正在连接控制台…" data-en="Connecting console…">正在连接控制台…</div>
    <script src="./novnc-lang.js"></script>
    <script type="module" src="./novnc-app.js"></script>
  </body>
</html>
